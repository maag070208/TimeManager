# TimeManager web — nginx para la SPA y la config de runtime.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Comprime JSON/JS/CSS/SVG: el bundle y las respuestas del API son grandes.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Cabeceras de seguridad (A3). `always` las manda también en 4xx/5xx.
  #
  # CSP con `script-src 'self'`: el build de Vite solo emite scripts externos
  # (`/assets/index-*.js` y `/config.js` de render-config.sh), sin inline.
  # `connect-src` es amplio porque `API_URL` se inyecta en runtime (config.js) y
  # la app habla con Ably (`wss:`) y con S3 firmado (`https:`/`http:` on-prem).
  # `worker-src blob:` es por el worker que crea pdf.js con createObjectURL.
  # Sin HSTS: el despliegue on-prem puede ir por HTTP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Para navegadores viejos que no aplican `frame-ancestors`.
  add_header X-Frame-Options "DENY" always;
  # El producto usa geolocalización y cámara (checada con foto), no micrófono.
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;

  # Assets con hash de Vite: caché inmutable.
  # nginx no hereda los `add_header` del server si el bloque define los suyos,
  # así que las cabeceras de seguridad se repiten en cada location con add_header.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
  }

  # config.js sale del render-config.sh (runtime); no se cachea.
  location = /config.js {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https: http: wss: ws:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
  }

  # SPA: cualquier ruta cae en index.html (HashRouter igual lo necesita).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
