# TimeManager web — nginx para la SPA y la config de runtime.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Comprime JSON/JS/CSS/SVG: el bundle y las respuestas del API son grandes.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml;

  # Assets con hash de Vite: caché inmutable.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # config.js sale del render-config.sh (runtime); no se cachea.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # SPA: cualquier ruta cae en index.html (HashRouter igual lo necesita).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
