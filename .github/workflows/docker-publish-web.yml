name: Docker publish web

# Publica la imagen de la web en Docker Hub SOLO a mano (pestaña Actions →
# Run workflow). No corre al hacer push: la web se publica cuando se decida.
# Requiere los mismos secretos que la API (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: axzydev/axzy_checklab_web
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
