name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter timemanager-api test:unit
      - run: pnpm --filter timemanager-api exec prisma generate

  app-android:
    name: App · pruebas y APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checklab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug

  app-ios:
    name: App · pruebas iOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: checklab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:iosSimulatorArm64Test

  integration:
    name: Integración API (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tm_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/tm_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter timemanager-api exec prisma generate
      - run: pnpm --filter timemanager-api exec prisma migrate deploy
      - run: pnpm --filter timemanager-api test:integration

  build-images:
    name: Build imágenes (sin push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: timemanager-api:ci
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: timemanager-web:ci

  e2e:
    name: E2E Playwright (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tm_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tm_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/tm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter timemanager-api exec prisma generate
      - run: DATABASE_URL="$E2E_DATABASE_URL" pnpm --filter timemanager-api exec prisma migrate deploy
      - run: pnpm --filter timemanager-web exec playwright install --with-deps chromium
      - name: E2E (suite completa)
        run: cd web && node scripts/e2e-run.mjs tests/e2e --project=chromium
